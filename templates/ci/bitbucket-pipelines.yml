# spec-driven-kit: server-side gate. Fails a pull request whose code change has no committed attestation for exactly that diff
# (and, for medium/high risk, no independent verifier PASS). Local hooks can be skipped with --no-verify; this cannot.
# Merge this into your existing bitbucket-pipelines.yml if you have one. Keep your own build/test steps next to it.
pipelines:
  pull-requests:
    '**':
      - step:
          name: spec-driven gate
          image: alpine/git:latest
          clone:
            depth: full
          script:
            - apk add --no-cache bash jq coreutils perl-utils
            - git fetch origin "$BITBUCKET_PR_DESTINATION_BRANCH"
            - VERIFY_BASE="origin/$BITBUCKET_PR_DESTINATION_BRANCH" bash __KIT_DIR__/scripts/sdd.sh ci-check
